<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" data-theme-favicon href="%PUBLIC_URL%/app-icon-1024.png" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/app-icon-1024.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Nutrifybe - Sistema completo de gestão nutricional para nutricionistas e pacientes. Gerencie consultas, prescrições e acompanhe o progresso de forma moderna e segura." />
    <meta name="keywords" content="nutrição, nutricionista, gestão, consultas, prescrições, saúde, alimentação" />
    <meta name="author" content="Equipe Nutrifybe - ITB Brasílio Flores" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nutrifybe - Sistema de Gestão Nutricional" />
    <meta property="og:description" content="Sistema completo para nutricionistas gerenciarem consultas e acompanharem pacientes" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Nutrifybe - Sistema de Gestão Nutricional" />
    <meta property="twitter:description" content="Sistema completo para nutricionistas gerenciarem consultas e acompanharem pacientes" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Nutrifybe - Sistema de Gestão Nutricional</title>
  </head>
  <body>
    <script>
      (function() {
        var isDark = localStorage.getItem('darkMode') === 'true';
        if (isDark) {
          document.body.classList.add('dark-mode');
        }
        var favicon = document.querySelector('[data-theme-favicon]');
        if (favicon) {
          favicon.href = '%PUBLIC_URL%/' + (isDark ? 'icone-roxo.png' : 'app-icon-1024.png');
        }
      })();
    </script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
